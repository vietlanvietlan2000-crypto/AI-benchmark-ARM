<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Bench Spark · Tech by Lân</title>
<link rel="icon" href="/logo-mark.png">
<script>
  // Đặt theme trước khi vẽ để không bị nháy màu.
  (function () {
    var t = null;
    try { t = localStorage.getItem("aibench.theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* ===== Giao diện SÁNG: trắng – xanh dương, gọn và sạch ===== */
  :root {
    --bg: #eaf0fa; --bg2: #f8fafe; --card: rgba(255,255,255,.84); --field: #f3f6fb; --text: #131a26; --muted: #5d6779;
    --line: #d5deec; --accent: #2563eb; --accent2: #7c3aed; --accent-text: #fff; --ok: #15803d; --bad: #b91c1c; --warn: #b45309;
    --soft: #e4ecff; --head: rgba(255,255,255,.92); --shadow: 0 6px 24px rgba(30,60,120,.10); --glow: 0 0 0 0 transparent;
    --grid: rgba(37,99,235,.07); --fx: 37,99,235; --fx2: 124,58,237; --orb1: rgba(37,99,235,.20); --orb2: rgba(124,58,237,.14);
    --c0: #2563eb; --c1: #d97706; --c2: #dc2626; --c3: #059669; --radius: 12px;
  }
  /* ===== Giao diện TỐI: đen – neon xanh/tím kiểu gaming ===== */
  :root[data-theme=dark] {
    --bg: #05080f; --bg2: #0b1222; --card: rgba(12,18,32,.62); --field: #0a0f1c; --text: #e6edf7; --muted: #8b98ad;
    --line: #1f2b42; --accent: #22d3ee; --accent2: #c084fc; --accent-text: #04121a; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24;
    --soft: #10233a; --head: rgba(8,12,22,.92); --shadow: 0 8px 30px rgba(0,0,0,.5);
    --glow: 0 0 26px rgba(34,211,238,.08);
    --grid: rgba(34,211,238,.06); --fx: 34,211,238; --fx2: 192,132,252; --orb1: rgba(34,211,238,.16); --orb2: rgba(192,132,252,.15);
    --c0: #22d3ee; --c1: #fbbf24; --c2: #fb7185; --c3: #4ade80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; min-height: 100vh; }

  /* ----- Nền công nghệ: lưới + quầng sáng trôi + mạng hạt (canvas) ----- */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
        background:
          linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
          linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 44px 44px,
          radial-gradient(1200px 700px at 85% -10%, var(--bg2), transparent 70%), var(--bg); }
  .orb { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; will-change: transform; }
  .orb.a { left: -14vmax; top: -18vmax; background: radial-gradient(circle, var(--orb1), transparent 62%); animation: float1 26s ease-in-out infinite alternate; }
  .orb.b { right: -16vmax; bottom: -20vmax; background: radial-gradient(circle, var(--orb2), transparent 62%); animation: float2 32s ease-in-out infinite alternate; }
  @keyframes float1 { to { transform: translate(16vmax, 10vmax) scale(1.15); } }
  @keyframes float2 { to { transform: translate(-14vmax, -12vmax) scale(1.2); } }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* Lưới trôi chậm toàn màn hình */
  .bg { animation: gridDrift 18s linear infinite; }
  @keyframes gridDrift { to { background-position: 0 44px, 44px 0, 0 0, 0 0; } }
  /* Sàn lưới phối cảnh kiểu cyberpunk, chạy về phía người xem */
  .floorwrap { position: absolute; left: 0; right: 0; bottom: 0; height: 42vh; overflow: hidden;
               perspective: 280px; perspective-origin: 50% 0; }
  .floor { position: absolute; left: -100%; right: -100%; bottom: 0; height: 300%; transform-origin: 50% 100%;
           transform: rotateX(75deg);
           background:
             linear-gradient(rgba(var(--fx),.55) 2px, transparent 2px) 0 0 / 70px 70px,
             linear-gradient(90deg, rgba(var(--fx2),.45) 2px, transparent 2px) 0 0 / 70px 70px;
           -webkit-mask-image: linear-gradient(to bottom, transparent, #000 60%); mask-image: linear-gradient(to bottom, transparent, #000 60%);
           opacity: .6; animation: floorRun 1.6s linear infinite; }
  @keyframes floorRun { to { background-position: 0 70px, 0 70px; } }
  .horizon { position: absolute; left: 0; right: 0; bottom: 42vh; height: 2px; opacity: .7;
             background: linear-gradient(90deg, transparent, rgba(var(--fx),.9), rgba(var(--fx2),.9), transparent);
             box-shadow: 0 0 18px 3px rgba(var(--fx),.35); animation: horizonPulse 4s ease-in-out infinite; }
  @keyframes horizonPulse { 50% { opacity: .3; } }
  /* Vệt quét sáng chạy từ trên xuống */
  .scan { position: absolute; left: 0; right: 0; top: -20vh; height: 18vh;
          background: linear-gradient(to bottom, transparent, rgba(var(--fx),.10) 80%, rgba(var(--fx),.45) 99%, transparent);
          animation: scanDown 7s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes scanDown { to { transform: translateY(140vh); } }
  /* Vạch quét kiểu màn hình CRT (chỉ giao diện tối) */
  :root[data-theme=dark] .bg::after { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
  :root:not([data-theme=dark]) .floor { opacity: .3; }
  .fx-off .orb, .fx-off .bg, .fx-off .floor, .fx-off .horizon, .fx-off .scan { animation: none; }
  .fx-off .scan { display: none; }
  @media (prefers-reduced-motion: reduce) { .orb, .bg, .floor, .horizon, .scan { animation: none; } .scan { display: none; } }
  header, main { position: relative; z-index: 1; }

  header { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; padding: 8px 24px;
           background: var(--head); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 5; }
  :root[data-theme=dark] header { border-image: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent) 1; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .brand img { height: 54px; width: auto; display: block; cursor: zoom-in; transition: transform .25s;
               filter: drop-shadow(0 3px 8px rgba(0,0,0,.25)); }
  .brand img:hover { transform: scale(1.08) rotate(-2deg); }
  .brand .name { font: italic 900 21px/1 "Segoe UI", "Arial Black", system-ui, sans-serif; letter-spacing: .02em; text-transform: uppercase; }
  :root[data-theme=dark] .brand .name { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text;
               background-clip: text; color: transparent; }
  .brand .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .brand .sub b { color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .dot.bad { background: var(--bad); }
  .eng { padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; border: 1px solid currentColor; white-space: nowrap; }
  .eng.gpu { color: var(--ok); } .eng.spill { color: var(--warn); } .eng.cpu { color: var(--bad); }
  .eng.idle, .eng.unknown { color: var(--muted); font-weight: 400; }
  .warnbox { border-left: 4px solid var(--warn); }
  .warnbox.cpu { border-left-color: var(--bad); }
  .warnbox b.t { display: block; margin-bottom: 6px; }
  .warnbox ul { margin: 6px 0 0; padding-left: 18px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 7px 10px; font-weight: 700; font-size: 12px; background: transparent; color: var(--muted); box-shadow: none; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .icon { width: 34px; height: 34px; padding: 0; font-size: 16px; line-height: 1; border-radius: 8px; }
  .icon.off { opacity: .45; }

  main { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; padding: 16px 24px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } header { padding: 8px 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
          box-shadow: var(--shadow), var(--glow); position: relative; backdrop-filter: blur(1.5px); }
  /* Viền neon chạy quanh thẻ (giao diện tối) */
  :root[data-theme=dark] .card::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent 20%, rgba(var(--fx),.95), rgba(var(--fx2),.95), transparent 80%) 0 0 / 300% 100%;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .7; animation: borderFlow 7s linear infinite; }
  @keyframes borderFlow { to { background-position: 300% 0; } }
  .fx-off .card::before { animation: none; opacity: .25; }
  @media (prefers-reduced-motion: reduce) { .card::before { animation: none; } }
  h2 { font-size: 15px; margin: 0 0 12px; }
  :root[data-theme=dark] h2 { color: var(--accent); letter-spacing: .03em; text-transform: uppercase; font-size: 13px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .help { color: var(--muted); font-size: 12px; font-weight: 400; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--field); color: var(--text); font: inherit; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .check { display: flex; gap: 8px; align-items: center; font-weight: 600; }
  input[type=checkbox] { accent-color: var(--accent); }
  button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card);
           color: var(--text); font: inherit; cursor: pointer; transition: border-color .15s, transform .1s; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; }
  :root[data-theme=dark] button.primary { background: linear-gradient(90deg, var(--accent), var(--accent2)); border-color: transparent;
           box-shadow: 0 0 18px rgba(34,211,238,.35); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .quick button { flex: 1; padding: 6px 8px; font-size: 13px; white-space: nowrap; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .row .primary { flex: 1; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s; }
  pre { margin: 0; max-height: 220px; overflow: auto; background: var(--field); border-radius: 6px; padding: 10px;
        font: 12px/1.5 Consolas, monospace; white-space: pre-wrap; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .tile { background: var(--field); border: 1px solid transparent; border-radius: 8px; padding: 10px 12px; }
  .tile:first-child { background: var(--soft); border-color: var(--accent); }
  .tile .l { color: var(--muted); font-size: 12px; }
  .tile .v { font-size: 22px; font-weight: 700; }
  :root[data-theme=dark] .tile .v { color: var(--accent); text-shadow: 0 0 14px rgba(34,211,238,.35); }
  .tile .u { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; text-shadow: none; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--field); } tr.sel { background: var(--soft); }
  .muted { color: var(--muted); } .err { color: var(--bad); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }
  svg { width: 100%; height: 180px; display: block; background: var(--field); border-radius: 6px; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .shot { border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--field); }
  .shot.pending { border-color: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { border-color: var(--line); } }
  .filebox { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 12px; padding: 10px 12px;
             background: var(--soft); border-radius: 8px; word-break: break-all; }
  .shot img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; background: #fff; cursor: zoom-in; }
  .shot .cap { padding: 8px 10px; font-size: 12.5px; }
  .shot .cap b { display: block; margin-bottom: 4px; }
  .chk.ok { color: var(--ok); } .chk.bad { color: var(--bad); font-weight: 600; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center;
          justify-content: center; cursor: zoom-out; z-index: 10; }
  #zoom.on { display: flex; }
  #zoom img { max-width: 94vw; max-height: 94vh; background: #fff; border-radius: 8px; }
  [hidden] { display: none !important; }
  /* ----- So sánh các lần chạy ----- */
  .cmpbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: -4px 0 10px; }
  .cmpbar .muted { margin-right: auto; font-size: 12.5px; }
  /* Thanh lọc tự xuống dòng theo độ rộng thẻ: ô tìm rộng nhất, các ô chọn chia đều */
  .hfilter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; align-items: center; }
  .hfilter[hidden] { display: none; }
  .hfilter input, .hfilter select { margin: 0; min-width: 0; width: auto; }
  .hfilter #hfText { flex: 2 1 240px; }
  .hfilter select, .hfilter #hfVga { flex: 1 1 160px; }
  .hfilter button { white-space: nowrap; flex: 0 0 auto; }
  .pager { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 12.5px; }
  .pager .pages { display: flex; gap: 4px; align-items: center; }
  .pager button { min-width: 32px; padding: 4px 9px; font-size: 12.5px; }
  .pager button.cur { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 700; box-shadow: 0 0 12px rgba(var(--fx),.45); }
  .pager .gap { padding: 0 4px; color: var(--muted); }
  .pager .psize { display: inline-flex; gap: 6px; align-items: center; margin: 0; color: var(--muted); }
  .pager select { width: auto; padding: 3px 6px; }
  select:disabled { opacity: .5; cursor: not-allowed; }
  .fit { margin-top: 6px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); border-left: 4px solid var(--muted);
         background: var(--field); font-size: 12.5px; line-height: 1.45; }
  .fit b { display: block; }
  .fit.ok { border-left-color: var(--ok); } .fit.ok b { color: var(--ok); }
  .fit.tight { border-left-color: var(--warn); } .fit.tight b { color: var(--warn); }
  .fit.warn { border-left-color: var(--warn); } .fit.warn b { color: var(--warn); }
  .fit.bad { border-left-color: var(--bad); } .fit.bad b { color: var(--bad); }
  .fit .muted { margin-top: 3px; font-size: 11.5px; }
  #liveCard { border-color: var(--accent); }
  #liveCard .last { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #live { max-height: 62vh; overflow: auto; }
  .q { display: inline-block; margin-left: 4px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent);
       font-size: 11px; font-weight: 700; letter-spacing: .02em; vertical-align: middle; white-space: nowrap; }
  .pick { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; margin: 0; }
  .pick input { width: 16px; height: 16px; cursor: pointer; }
  .pick .ord { display: inline-block; min-width: 14px; font-size: 11px; font-weight: 700; color: var(--accent); }
  #compare { position: relative; z-index: 1; padding: 16px 24px; max-width: 1500px; margin: 0 auto; }
  .cmphead { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
  .cmphead h2 { margin: 0; font-size: 17px; }
  /* Cột cố định: cột tiêu chí 180px, các cột kết quả chia đều nhau dù chọn 2, 3, 4 hay 5 lần chạy */
  table.cmp { table-layout: fixed; }
  table.cmp th, table.cmp td { white-space: normal; vertical-align: top; overflow-wrap: anywhere; }
  table.cmp th:first-child, table.cmp td:first-child { font-weight: 600; color: var(--text); }
  table.cmp th .eng { display: inline-block; max-width: 100%; }
  table.cmp th.base, table.cmp td.base { background: var(--soft); }
  table.cmp th { color: var(--text); font-weight: 400; }
  table.cmp th .hd { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  table.cmp th .hd button { padding: 3px 8px; font-size: 12px; }
  table.cmp th .hd .x { margin-left: auto; }
  table.cmp th .m { font-weight: 700; font-size: 14px; word-break: break-word; }
  table.cmp .tag { background: var(--accent); color: var(--accent-text); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  table.cmp tr.grp td { background: var(--field); color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; font-size: 12.5px; }
  table.cmp tr.grp label { display: inline-flex; gap: 6px; align-items: center; margin: 0 0 0 14px; text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; }
  table.cmp tr.grp input { width: 90px; padding: 3px 6px; }
  .cv { font-size: 17px; font-weight: 700; } .cv .u { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .cbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 5px 0; }
  .cbar > div { height: 100%; background: var(--muted); }
  .cbar.base > div { background: var(--accent); } .cbar.good > div { background: var(--ok); } .cbar.bad > div { background: var(--bad); }
  .cp { font-size: 12.5px; color: var(--muted); } .cp b { font-size: 14px; color: var(--text); margin-right: 4px; }
  .cp.good span { color: var(--ok); font-weight: 600; } .cp.bad span { color: var(--bad); font-weight: 600; }
  .cost { margin-top: 4px; font-size: 12.5px; color: var(--warn); font-weight: 600; }
  /* ----- Chatbot ----- */
  #chatView { position: relative; z-index: 1; display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 16px; padding: 16px 24px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { #chatView { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
  /* Gợi ý model theo VRAM */
  .sugg { margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--accent); border-radius: 10px; background: var(--soft); font-size: 13px; }
  .sugg summary { cursor: pointer; font-weight: 700; color: var(--accent); }
  .sugg[open] summary { margin-bottom: 6px; }
  .sgrow { display: flex; gap: 6px; align-items: baseline; padding: 2px 0; }
  .sgrow span { color: var(--muted); min-width: 92px; }
  .sgrow b { flex: 1; min-width: 0; word-break: break-all; }
  .sgrow em { font-style: normal; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .sgtip { margin-top: 6px; color: var(--warn); font-size: 12.5px; }
  .sgsame { margin-top: 6px; color: var(--ok); font-weight: 600; }
  .sugg button { margin-top: 8px; width: 100%; }
  .chatcard { display: flex; gap: 14px; height: calc(100vh - 120px); min-height: 420px; }
  .chatmain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #chatLog { flex: 1; overflow: auto; padding-right: 4px; }
  /* Lịch sử hội thoại */
  .convpane { width: 250px; flex: 0 0 250px; display: flex; flex-direction: column; gap: 8px; padding-right: 14px; border-right: 1px solid var(--line); min-height: 0; }
  .chatcard.noconv .convpane { display: none; }
  .convhead { display: flex; align-items: center; gap: 8px; }
  .convhead b { flex: 1; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); }
  .convhead button { padding: 5px 10px; font-size: 12.5px; }
  #convSearch { margin: 0; padding: 6px 9px; font-size: 13px; }
  #convList { flex: 1; overflow: auto; margin-right: -6px; padding-right: 6px; }
  .convgrp { margin: 10px 2px 4px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

// tr: dịch chữ của server. trx: chỉ dịch khi khớp nguyên cụm (dùng cho ô bảng, tránh sửa nhầm dữ liệu hóa đơn).
const tr = s => {
  if (lang === "vi" || typeof s !== "string") return s;
  if (D[s] != null) return D[s];
  return R.reduce((o, [re, to]) => o.replace(re, to), s);
};
const trx = s => lang === "vi" || typeof s !== "string" ? s : (D[s] ?? s.replace(/^Song song ×(\d+)$/, "Parallel ×$1"));

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(tr((await r.json().catch(() => ({}))).detail || r.statusText));
  return r.json();
};
const fmt = v => v == null ? "–" : typeof v === "number" ? v.toLocaleString(lang === "vi" ? "vi-VN" : "en-US") : v;

let mods = [], models = [], lmUp = false, jobId = null, selected = null, imagesVer = 0;
let lastLog = [], lmStarting = false, connLost = false, lastGpu = null, lastEng = null, lastRam = null;
const gb = mb => fmt(Math.round((mb || 0) / 102.4) / 10);
// Nhãn ngắn: model chạy bằng GPU / GPU tràn VRAM / CPU, kèm vài con số.
function engLabel(e) {
  if (!e || e.mode === "unknown") return "";
  if (e.mode === "idle") return t("engIdle");
  const parts = [e.mode === "gpu" ? t("engGpu", e) : e.mode === "spill" ? t("engSpill") : t("engCpu")];
  if (e.mode !== "cpu" && e.vram_mb != null) parts.push(`VRAM ${gb(e.vram_mb)} GB`);
  if (e.mode === "spill") parts.push(t("engShared", gb(e.shared_mb)));
  if (e.mode === "gpu" && e.gpu_layers > 0) parts.push(e.gpu_layers >= 1000 ? t("engAll") : t("engLayers", e.gpu_layers));
  if (e.ctx) parts.push(t("engCtx", fmt(e.ctx)));
  return parts.join(" · ");
}

// Thẻ ảnh: ảnh gửi cho AI + câu trả lời của AI so với đáp án.
function shotCard(im) {
  const checks = (im.checks || []).map(c =>
    c.ok == null ? `<div class="chk muted">… ${esc(tr(c.label))}: ${t("expected")} ${esc(c.expected)}</div>`
    : c.ok ? `<div class="chk ok">✓ ${esc(tr(c.label))}: ${esc(tr(c.got))}</div>`
    : `<div class="chk bad">✗ ${esc(tr(c.label))}: ${t("aiSaid")} ${esc(tr(c.got))} · ${t("expected")} ${esc(c.expected)}</div>`).join("");
  const fields = (im.fields || []).map(f => `<div><span class="muted">${esc(tr(f.label))}:</span> ${esc(fmt(f.label === "Lỗi" ? tr(f.value) : f.value))}</div>`).join("");
  const meta = im.status === "pending" ? t("pendingImg") : tr(im.meta || "");
  return `<div class="shot ${esc(im.status || "done")}"><img src="${esc(im.src)}" alt="${esc(tr(im.title))}" loading="lazy">
    <div class="cap"><b>${esc(tr(im.title))}</b>${checks}${fields}<div class="muted" style="margin-top:4px">${esc(meta)}</div></div></div>`;
}
const galleryHtml = (images, title) => images.length
  ? `<h3>${esc(title)}</h3><div class="gallery">${images.map(shotCard).join("")}</div>` : "";

async function showLive(job) {
  if (job.images_ver === imagesVer) return;
  imagesVer = job.images_ver;
  const images = await api(`/api/jobs/${job.id}/images`);
  $("live").innerHTML = galleryHtml(images.slice().reverse(), t("liveTitle"));
}
// Khung "đang chạy" ở đầu cột phải: luôn hiện trong lúc test, kể cả khi người dùng mở xem kết quả cũ bên dưới.
function paintLive(job) {
  const mod = mods.find(m => m.id === job.module);
  $("liveTitle").innerHTML = `${t("liveRun")}: ${esc(mod ? tr(mod.name) : "")}${job.model ? " · " + modelHtml(job.model) : ""}`;
  $("livePct").textContent = Math.round(job.progress * 100) + "%";
  $("liveBar").style.width = (job.progress * 100) + "%";
  const last = lastLog[lastLog.length - 1];
  $("liveLast").textContent = last ? tr(last) : t("liveHint");
  $("liveCard").hidden = false;
}

let mdirs = null, mdirBusy = "";
async function loadDirs() { try { mdirs = await api("/api/model-dirs"); } catch (e) {} paintDirs(); }
function paintDirs() {
  const el = $("mdir");
  el.disabled = !!mdirBusy || !!jobId || !mdirs;
  $("mdirHelp").textContent = mdirBusy ? t(mdirBusy) : t("mdirHelp");
  if (!mdirs || document.activeElement === el) return;
  el.innerHTML = mdirs.dirs.map(d => `<option value="${esc(d.path)}"${d.current ? " selected" : ""}>${esc(d.path)}${d.default ? ` (${t("mdirDefault")})` : ""} — ${t("mdirOpt", d.models, d.free_gb)}</option>`).join("")
    + `<option value="">${t("mdirOther")}</option>`;
}
$("mdir").onchange = async () => {
  const el = $("mdir"); el.blur();
  const path = el.value || (prompt(t("mdirAsk")) || "").trim();
  if (!path || path === mdirs.current || !confirm(t("mdirConfirm", path))) return paintDirs();
  try {
    mdirBusy = "mdirBusy"; paintDirs();
    await api("/api/model-dir", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path})});
  } catch (e) { alert(tr(e.message)); }
  mdirBusy = ""; await loadDirs(); refreshStatus();
};

async function refreshStatus() {
  try {
    const s = await api("/api/status");
    const had = models.length;
    lmUp = s.ollama.up; models = s.models;
    if (!had && models.length) loadHistory().catch(() => {});  // để lịch sử cũ tra được tham số nén
    $("lmDot").className = "dot " + (lmUp ? "ok" : "bad");
    $("lmStart").hidden = lmUp;
    lastGpu = s.gpu; lastEng = s.engine; lastRam = s.ram_total_mb || null; connLost = false;
    paintStatus();
    fillModels();
    if (s.running_job && !jobId) { jobId = s.running_job; poll(); }
  } catch (e) { connLost = true; paintStatus(); $("lmDot").className = "dot bad"; }
  $("run").disabled = !lmUp || !!jobId;
  $("module").disabled = !!jobId;  // đang chạy thì không cho đổi bài test
  paintDirs();
  if (view === "chat") { fillChatModels(); paintChat(); if (!chatState || !chatState.indexing.running) loadChatState(); }
  syncQuick();
}
// Dòng trạng thái trên thanh đầu (tách riêng để đổi ngôn ngữ là vẽ lại được ngay).
function paintStatus() {
  $("lmText").textContent = connLost ? t("lost") : lmStarting ? t("lmStarting") : lmUp ? t("lmUp", models.length) : t("lmDown");
  const e = lmUp ? lastEng : null, label = engLabel(e), w = $("engWarn");
  $("engText").hidden = !label; $("engText").className = "eng " + (e ? e.mode : "unknown"); $("engText").textContent = label;
  w.hidden = !(e && (e.mode === "spill" || e.mode === "cpu")); w.classList.toggle("cpu", !!e && e.mode === "cpu");
  if (!w.hidden) w.innerHTML = e.mode === "spill"
    ? `<b class="t">${t("spillTitle")}</b>${esc(t("spillBody", e, gb((e.vram_mb || 0) + (e.shared_mb || 0)), gb(lastGpu && lastGpu.vram_total_mb)))}<ul>${t("spillFix").map(x => `<li>${x}</li>`).join("")}</ul>`
    : `<b class="t">${t("cpuTitle")}</b>${esc(t("cpuBody", e))}`;
  const g = lastGpu;
  if (!g) return;
  $("gpuText").textContent = g.name
    ? `${g.name} · ${fmt(g.vram_used_mb)} / ${fmt(g.vram_total_mb)} MB ${g.unified ? t("memShared") : "VRAM"}` +
      (g.power_w != null ? ` · ${t("gpuPower", fmt(Math.round(g.power_w)))}` : "") + ` · driver ${g.driver}`
    : t("gpuNone");
}
// Các nút chạy nhanh bật/tắt theo nút Chạy.
const syncQuick = () => document.querySelectorAll(".quick button").forEach(b => { b.disabled = $("run").disabled; });

// Tham số nén (quantization, vd. MXFP4, Q4_K_M): lấy từ kết quả đã lưu; kết quả cũ chưa lưu thì tra theo model đang có trong Ollama.
const quantOf = (id, q) => q || (models.find(m => m.id === id) || {}).quantization || "";
const modelHtml = (id, q) => esc(id || "") + (quantOf(id, q) ? ` <span class="q">${esc(quantOf(id, q))}</span>` : "");

// ----- Model có hợp phần cứng không: ước lượng trước khi chạy -----
// Bộ nhớ cần = file model (+5% và 300 MB phụ trội) + bộ nhớ ngữ cảnh (~2,3 MB cho mỗi 1.024 token trên mỗi GB model,
// rút ra từ các lần đo thật trên máy này). Chỉ là ước lượng; khi model đang nạp thì ưu tiên số đo thật.
const FIT_CTX = 8192, FIT_RESERVE = 1024;
// Bộ nhớ dành cho model (MB): VRAM của card rời; máy bộ nhớ chung (RTX Spark, GPU tích hợp) chỉ tính ~75% RAM,
// phần còn lại để cho Windows và các ứng dụng khác.
const usableMb = () => !lastGpu || !lastGpu.vram_total_mb ? 0 : lastGpu.unified ? lastGpu.vram_total_mb * 0.75 : lastGpu.vram_total_mb;
function fitOf(id) {
  const m = models.find(x => x.id === id), vram = usableMb();
  if (!m || !m.size_bytes || !vram) return null;
  const sizeGb = m.size_bytes / 2 ** 30, perK = sizeGb * 2.3;
  const w = m.size_bytes / 2 ** 20 * 1.05 + 300;
  const loaded = m.state === "loaded", ctx = (loaded && m.loaded_context_length) || FIT_CTX;
  const need = w + perK * ctx / 1024, base = w + perK * FIT_CTX / 1024;
  let max = Math.floor((vram - FIT_RESERVE - w) / perK / 4) * 4096;  // ngữ cảnh lớn nhất còn vừa VRAM, làm tròn xuống 4.096
  if (m.max_context_length) max = Math.min(max, m.max_context_length);
  const f = {size: gb(m.size_bytes / 2 ** 20), est: true, tip: ""};
  const eng = loaded && models.filter(x => x.state === "loaded").length === 1 ? lastEng : null;
  if (eng && eng.mode === "cpu") Object.assign(f, {level: "bad", title: t("fitWarnT"), text: t("fitCpu"), est: false});
  else if (eng && eng.mode === "spill") Object.assign(f, {level: "warn", title: t("fitWarnT"), text: t("fitSpill", gb(eng.shared_mb)), est: false});
  else if (lastRam && w > vram + lastRam * 0.8) Object.assign(f, {level: "bad", title: t("fitBadT"), text: t("fitNo", gb(base), gb(vram), gb(lastRam))});
  else if (base > vram) Object.assign(f, {level: "warn", title: t("fitWarnT"), text: t("fitOver", gb(base), gb(vram))});
  else if (loaded && need > vram - FIT_RESERVE && max >= 4096) Object.assign(f, {level: "warn", title: t("fitWarnT"), text: t("fitCtx", gb(need), gb(vram), fmt(ctx), fmt(max))});
  else {
    const tight = need > vram - FIT_RESERVE;
    Object.assign(f, {level: tight ? "tight" : "ok", title: t(tight ? "fitTightT" : "fitOkT"), text: t(tight ? "fitTight" : "fitOk", gb(need), gb(vram))});
    if (!loaded && max >= 4096 && max < (m.max_context_length || Infinity)) f.tip = t("fitCtxTip", fmt(max));
  }
  f.risky = f.level === "warn" || f.level === "bad";
  return f;
}
function paintFit() {
  document.querySelectorAll("select[data-type=model]").forEach(sel => {
    const box = sel.nextElementSibling;
    if (!box || !box.classList.contains("fit")) return;
    const f = fitOf(sel.value);
    box.hidden = !f;
    if (!f) return;
    box.className = "fit " + f.level;
    box.innerHTML = `<b>${esc(f.title)}</b>${esc(f.text)}${f.tip ? " " + esc(f.tip) : ""}` + (f.est ? `<div class="muted">${esc(t("fitEst", f.size))}</div>` : "");
  });
}

function fillModels() {
  document.querySelectorAll("select[data-type=model]").forEach(sel => {    const cur = sel.value;
    const only = sel.dataset.filter ? sel.dataset.filter.split(",") : null;  // vd. "vlm" = chỉ model thị giác
    const list = models.filter(m => only ? only.includes(m.type) : m.type !== "embeddings");
    sel.innerHTML = list.length
      ? list.map(m => `<option value="${esc(m.id)}">${esc(m.id)}${m.quantization ? ` (${esc(m.quantization)})` : ""}${m.state === "loaded" ? t("loaded") : ""}${m.type === "vlm" ? t("vision") : ""}</option>`).join("")
      : `<option value="">${esc(t("noModel"))}</option>`;
    const loaded = list.find(m => m.state === "loaded");
    sel.value = list.some(m => m.id === cur) ? cur : (loaded || list[0] || {id: ""}).id;
  });
  paintFit();
}

function renderForm() {
  const m = mods.find(x => x.id === $("module").value);
  if (!m) return;
  $("moduleDesc").textContent = tr(m.description);
  $("form").innerHTML = m.params.map(p => {
    const help = p.help ? `<div class="help">${esc(tr(p.help))}</div>` : "";
    const a = `name="${esc(p.key)}" data-type="${esc(p.type)}"`;
    if (p.type === "bool")
      return `<label class="check"><input type="checkbox" ${a} ${p.default ? "checked" : ""}>${esc(tr(p.label))}</label>${help}`;
    let input;
    if (p.type === "model") input = `<select ${a} data-filter="${esc((p.options || []).join(","))}"></select><div class="fit" hidden></div>`;
    else if (p.type === "select") input = `<select ${a}>${(p.options || []).map(o => `<option ${o === p.default ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (p.type === "int") input = `<input type="number" ${a} value="${esc(p.default)}" ${p.min != null ? `min="${p.min}"` : ""} ${p.max != null ? `max="${p.max}"` : ""}>` +
      ((p.presets || []).length ? `<div class="quick">${p.presets.map(n =>
        `<button type="button" data-quick="${esc(p.key)}" data-value="${n}">${esc(t("runN", n, tr(p.unit || "")))}</button>`).join("")}</div>` : "");
    else if (p.type === "textarea") input = `<textarea rows="5" ${a}>${esc(p.default)}</textarea>`;
    else input = `<input type="text" ${a} value="${esc(p.default)}">`;
    return `<label>${esc(tr(p.label))}</label>${input}${help}`;

function formParams() {
  const out = {};
  $("form").querySelectorAll("[name]").forEach(el => { out[el.name] = el.type === "checkbox" ? el.checked : el.value; });

}

async function run() {
  // Cảnh báo trước khi chạy nếu model được chọn không hợp phần cứng.
  const risky = [...$("form").querySelectorAll("select[data-type=model]")].map(s => fitOf(s.value)).find(f => f && f.risky);
  if (risky && !confirm(t("fitConfirm", `${risky.title}\n${risky.text}`))) return;
  try {
    const job = await api("/api/jobs", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({module: $("module").value, params: formParams()})});
    jobId = job.id; poll();
  } catch (e) { alert(e.message); }
}

async function poll() {
  $("jobCard").hidden = false; $("cancel").hidden = false; $("run").disabled = true; $("module").disabled = true; syncQuick();
  let job;
  try { job = await api("/api/jobs/" + jobId); } catch (e) { jobId = null; $("liveCard").hidden = true; refreshStatus(); return; }
  $("jobBar").style.width = (job.progress * 100) + "%";
  $("jobPct").textContent = job.status === "running" ? Math.round(job.progress * 100) + "%" : "";
  lastLog = job.log; const log = $("jobLog"); log.textContent = lastLog.map(tr).join("\n"); log.scrollTop = log.scrollHeight;
  if (job.status === "running") paintLive(job);
  if (job.images_ver) await showLive(job).catch(() => {});
  if (job.status === "running") { setTimeout(poll, 700); return; }
  jobId = null; imagesVer = 0; $("cancel").hidden = true; $("liveCard").hidden = true; $("live").innerHTML = "";
  await refreshStatus(); histPage = 1; await loadHistory();  // lần chạy mới nằm ở trang đầu
  if (job.result_id) showResult(job.result_id);
}

function chartSvg(c) {
  const W = 1000, H = 180, P = 8, n = c.x.length;
  if (n < 2) return "";
  const x0 = c.x[0], x1 = c.x[n - 1] || 1;
  let lines = "", legend = "";
  c.series.forEach((s, i) => {
    const vals = s.data.filter(v => v != null);
    if (!vals.length) return;
    const max = Math.max(...vals, 1e-9);
    const pts = s.data.map((v, k) => v == null ? null :
      `${(P + (c.x[k] - x0) / (x1 - x0) * (W - 2 * P)).toFixed(1)},${(H - P - v / max * (H - 2 * P)).toFixed(1)}`).filter(Boolean);
    lines += `<polyline fill="none" stroke="var(--c${i % 4})" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.join(" ")}"/>`;
    legend += `<span><i style="background:var(--c${i % 4})"></i>${esc(tr(s.name))} · ${t("peak")} ${fmt(max)} ${esc(s.unit || "")}</span>`;
  });
  return `<h3>${esc(tr(c.title))}</h3><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines}</svg>
    <div class="legend">${legend}<span>${t("chartNote", fmt(Math.round(x1 - x0)))}</span></div>`;
}

async function showResult(id) {
  let r;
  try { r = await api("/api/results/" + id); } catch (e) { return; }
  selected = id;
  document.querySelectorAll("#history tr").forEach(tr => tr.classList.toggle("sel", tr.dataset.id === id));
  const res = r.result || {};
  $("resultTitle").innerHTML = `${esc(tr(r.module_name))} · ${modelHtml(r.params.model, (r.model_info || {}).quantization)}`;
  let h = `<div class="muted" style="margin-bottom:12px">${esc(r.started_at.replace("T", " "))} · ${esc(r.gpu.name || "GPU ?")} · ${t("ranFor", fmt(r.duration_s))}` +
    (engLabel(r.engine) && r.engine.mode !== "idle" ? `<br>${t("engRan")}: <span class="eng ${esc(r.engine.mode)}">${esc(engLabel(r.engine))}</span>` : "") + `</div>`;
  h += `<div class="tiles">` + (res.summary || []).map(s =>
    `<div class="tile"><div class="l">${esc(tr(s.label))}</div><div class="v">${esc(fmt(s.value))}<span class="u">${esc(tr(s.unit || ""))}</span></div></div>`).join("") + `</div>`;
  (res.files || []).forEach(f => {
    h += `<div class="filebox"><b>${esc(tr(f.label))}:</b> <span>${esc(f.path)}</span>
      <button data-open="${esc(f.path)}">${t("openFile")}</button></div>`;
  });
  h += galleryHtml(res.images || [], t("galleryTitle"));
  if (res.text) h += `<h3>${t("answer")}</h3><pre style="max-height:400px">${esc(res.text)}</pre>`;
  (res.tables || []).forEach(tb => {
    h += `<h3>${esc(tr(tb.title))}</h3><div class="scroll"><table><tr>${tb.columns.map(c => `<th>${esc(tr(c))}</th>`).join("")}</tr>` +
      tb.rows.map(row => `<tr>${row.map(c => `<td>${esc(fmt(trx(c)))}</td>`).join("")}</tr>`).join("") + `</table></div>`;
  });
  (res.charts || []).forEach(c => { h += chartSvg(c); });
  $("result").className = ""; $("result").innerHTML = h;
}

// Lịch sử có phân trang: danh sách tải 1 lần, chỉ vẽ trang đang xem. Ô tick so sánh giữ nguyên khi chuyển trang.
let histList = [], histPage = 1;
let histSize = (v => [10, 20, 50].includes(+v) ? +v : 10)(store.get("histSize"));
async function loadHistory() {
  histList = await api("/api/results");
  fillHistFilter();
  renderHistory();
}
// ----- Bộ lọc lịch sử: bài test, model, VGA và ô tìm tự do (không phân biệt hoa thường, dấu) -----
const fold = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase();
function fillHistFilter() {
  $("histFilter").hidden = !histList.length;
  const uniq = key => [...new Set(histList.map(key).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const fillSel = (id, all, items) => {
    const el = $(id), cur = el.value;
    el.innerHTML = `<option value="">${esc(t(all))}</option>` + items.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join("");
    el.value = items.some(([v]) => v === cur) ? cur : "";
  };
  const tests = new Map(histList.map(r => [r.module || r.module_name, tr(r.module_name)]));
  fillSel("hfTest", "hfTest", [...tests].sort((a, b) => a[1].localeCompare(b[1])));
  fillSel("hfModel", "hfModel", uniq(r => r.model).map(m => [m, m]));
  $("hfVgaList").innerHTML = uniq(r => r.gpu).map(g => `<option value="${esc(g)}">`).join("");
}
function histFiltered() {
  const test = $("hfTest").value, model = $("hfModel").value, vga = fold($("hfVga").value).trim();
  const words = fold($("hfText").value).split(/\s+/).filter(Boolean);
  $("hfClear").hidden = !(test || model || vga || words.length);
  return histList.filter(r => {
    if (test && (r.module || r.module_name) !== test) return false;
    if (model && r.model !== model) return false;
    if (vga && !fold(r.gpu).includes(vga)) return false;
    if (!words.length) return true;
    const hay = fold([r.started_at, r.module_name, tr(r.module_name), r.model, r.quant, r.gpu,
      ...(r.summary || []).map(s => `${s.label} ${tr(s.label)} ${s.value} ${s.unit || ""}`)].join(" "));
    return words.every(w => hay.includes(w));  // mọi từ đều phải có
  });
}
["hfText", "hfVga"].forEach(id => $(id).addEventListener("input", () => { histPage = 1; renderHistory(); }));
["hfTest", "hfModel"].forEach(id => $(id).addEventListener("change", () => { histPage = 1; renderHistory(); }));
$("hfClear").onclick = () => {
  ["hfText", "hfVga", "hfTest", "hfModel"].forEach(id => { $(id).value = ""; });
  histPage = 1; renderHistory();
};
function pagerHtml(page, pages, total, all) {
  const from = (page - 1) * histSize + 1, to = Math.min(total, page * histSize);
  const info = total < all ? t("histShowF", from, to, total, all) : t("histShow", from, to, total);
  // Số trang: luôn có trang đầu, cuối và 2 trang quanh trang hiện tại; chỗ trống thay bằng "…"
  const nums = [];
  for (let p = 1; p <= pages; p++)
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) nums.push(p);
    else if (nums[nums.length - 1] !== "…") nums.push("…");
  const btn = (p, label, dis, cur) => `<button data-page="${p}"${dis ? " disabled" : ""}${cur ? ' class="cur" aria-current="page"' : ""}>${label}</button>`;
  return `<div class="pager"><span class="muted">${info}</span>
    <span class="pages">${btn(page - 1, "‹", page <= 1)}${nums.map(p => p === "…" ? '<span class="gap">…</span>' : btn(p, p, false, p === page)).join("")}${btn(page + 1, "›", page >= pages)}</span>
    <label class="psize">${t("histPer")} <select id="histSize">${[10, 20, 50].map(n => `<option${n === histSize ? " selected" : ""}>${n}</option>`).join("")}</select></label></div>`;
}
function renderHistory() {
  if (!histList.length) { $("history").innerHTML = `<span class="muted">${t("histEmpty")}</span>`; return; }
  const list = histFiltered();
  if (!list.length) { $("history").innerHTML = `<div class="filebox">${t("hfNone")}</div>`; return; }
  const pages = Math.max(1, Math.ceil(list.length / histSize));
  histPage = Math.min(Math.max(1, histPage), pages);
  const rows = list.slice((histPage - 1) * histSize, histPage * histSize);
  $("history").innerHTML = `<div class="scroll"><table><tr><th></th>${t("cols").map(c => `<th>${c}</th>`).join("")}</tr>` +
    rows.map(r => `<tr class="click ${r.id === selected ? "sel" : ""}" data-id="${esc(r.id)}">
      <td><label class="pick"><input type="checkbox" data-cmp="${esc(r.id)}"><span class="ord"></span></label></td>
      <td>${esc((r.started_at || "").replace("T", " "))}</td><td>${esc(tr(r.module_name))}</td><td>${modelHtml(r.model, r.quant)}</td><td>${esc(r.gpu || "")}</td>
      <td>${r.summary.slice(0, 4).map(s => `${esc(tr(s.label))}: <b>${esc(fmt(s.value))}</b> ${esc(tr(s.unit || ""))}`).join(" · ")}</td></tr>`).join("") + `</table></div>` + (list.length > 10 || list.length < histList.length ? pagerHtml(histPage, pages, list.length, histList.length) : "");
  document.querySelectorAll("#history tr.click").forEach(tr => tr.onclick = e => { if (!e.target.closest(".pick")) showResult(tr.dataset.id); });
  syncCmp();
}

const cmpData = {};
// Chiều "tốt": 1 = càng cao càng mạnh, -1 = càng thấp càng tốt (điện, độ trễ, nhiệt...), 0 = chỉ để tham khảo.
const LOWER = new Set(["Độ trễ token đầu", "Thời gian nạp model", "Thời gian mỗi hóa đơn", "Nhiệt độ cao nhất"]);

// 1 ô: giá trị, thanh, % so với mốc (cột đầu), và tiền điện nếu là số đo điện.
function cmpCell(row, i) {
  const s = row.cells[i], base = i === 0 ? " class=\"base\"" : "";
  if (!s || s.value == null) return `<td${base}><span class="muted">–</span></td>`;
  const v = s.value;
  let h = `<div class="cv">${esc(fmt(v))}<span class="u">${esc(tr(s.unit || ""))}</span></div>`;
  if (typeof v !== "number") return `<td${base}>${h}</td>`;
  const b = row.cells[0] && row.cells[0].value;
  const max = Math.max(...row.cells.map(c => c && typeof c.value === "number" ? Math.abs(c.value) : 0), 1e-9);
  let cls = "base", note = t("cmpBase"), pct = 100;
  if (i > 0) {
    if (typeof b === "number" && b > 0) {
      pct = v / b * 100;
      const n = Math.round(Math.abs(pct - 100)), d = fmt(n), up = pct > 100, arrow = up ? "▲ " : "▼ ";
      if (n < 1) { cls = "same"; note = t("cmpSame"); }
      else if (row.dir > 0) { cls = up ? "good" : "bad"; note = arrow + t(up ? "stronger" : "weaker", d); }
      else if (row.dir < 0) { cls = up ? "bad" : "good"; note = arrow + t(up ? "higherBad" : "lowerGood", d); }
      else { cls = "same"; note = arrow + t(up ? "higherN" : "lowerN", d); }
    } else pct = null;  // mốc không có tiêu chí này → không tính được %
  }
  h += `<div class="cbar ${pct == null ? "same" : cls}"><div style="width:${(Math.abs(v) / max * 100).toFixed(1)}%"></div></div>`;
  if (pct != null) h += `<div class="cp ${cls}"><b>${fmt(Math.round(pct))}%</b><span>${note}</span></div>`;
  if (s.unit === "Wh") h += `<div class="cost" title="${t("costTip")}">${money(v / 1000 * price)}</div>`;
  if (s.unit === "W") h += `<div class="cost" title="${t("costTip")}">${money(v / 1000 * price)}${t("perHour")}</div>`;
  return `<td${base}>${h}</td>`;
}

// Mạng hạt nối nhau + "gói dữ liệu" chạy trên đường nối. Vẽ ~30 hình/giây bằng canvas 2D để nhẹ máy.
const fx = (() => {
  const cv = $("fx"), cx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LINK = 150;
  let W = 0, H = 0, nodes = [], packets = [], streams = [], raf = 0, last = 0, c1 = "", c2 = "";
  const self = { on: store.get("fx") !== "0", recolor, toggle };
  function recolor() {
    const cs = getComputedStyle(root);
    c1 = cs.getPropertyValue("--fx").trim(); c2 = cs.getPropertyValue("--fx2").trim();
    if (self.on && !raf) draw(false);
  }
  function resize() {
    const d = Math.min(devicePixelRatio || 1, 1.5);
    W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0);
    const n = Math.min(90, Math.round(W * H / 20000));
    nodes = Array.from({length: n}, () => ({x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .6, vy: (Math.random() - .5) * .6, r: 1 + Math.random() * 1.8}));
    packets = [];
    // Dòng mã rơi (digital rain) thưa, mờ: mỗi cột một chuỗi ký tự hex
    streams = Array.from({length: Math.round(W / 70)}, () => newStream(true));
    if (self.on && !raf) draw(false);
  }
  const GLYPHS = "01ABCDEF<>/{}#$%アイウエオカキ";
  function newStream(any) {
    return {x: Math.floor(Math.random() * W / 18) * 18 + 6, y: any ? Math.random() * H : -Math.random() * H * .5,
      v: 1.2 + Math.random() * 2.6, len: 8 + Math.floor(Math.random() * 16),
      s: Array.from({length: 24}, () => GLYPHS[Math.floor(Math.random() * GLYPHS.length)])};
  }
  function draw(move) {
    cx.clearRect(0, 0, W, H);
    cx.font = "13px Consolas, monospace";
    for (let k = 0; k < streams.length; k++) {
      const st = streams[k];
      if (move) { st.y += st.v; if (Math.random() < .05) st.s[Math.floor(Math.random() * st.s.length)] = GLYPHS[Math.floor(Math.random() * GLYPHS.length)]; }
      for (let i = 0; i < st.len; i++) {
        const y = st.y - i * 16; if (y < -16 || y > H + 16) continue;
        cx.fillStyle = i === 0 ? `rgba(${c1},.75)` : `rgba(${i % 5 === 0 ? c2 : c1},${(.32 * (1 - i / st.len)).toFixed(3)})`;
        cx.fillText(st.s[i % st.s.length], st.x, y);
      }
      if (st.y - st.len * 16 > H) streams[k] = newStream(false);
    }
    if (move) for (const p of nodes) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    cx.lineWidth = 1;
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 > LINK * LINK) continue;
      cx.strokeStyle = `rgba(${c1},${(.5 * (1 - Math.sqrt(d2) / LINK)).toFixed(3)})`;
      cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke();
      if (move && packets.length < 24 && Math.random() < .003) packets.push({a, b, k: 0});
    }
    cx.fillStyle = `rgba(${c1},.75)`;
    for (const p of nodes) { cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill(); }
    packets = packets.filter(p => p.k <= 1);
    for (const p of packets) {
      if (move) p.k += .025;
      const x = p.a.x + (p.b.x - p.a.x) * p.k, y = p.a.y + (p.b.y - p.a.y) * p.k;
      cx.fillStyle = `rgba(${c2},.22)`; cx.beginPath(); cx.arc(x, y, 7, 0, 6.283); cx.fill();
      cx.fillStyle = `rgba(${c2},.95)`; cx.beginPath(); cx.arc(x, y, 2.4, 0, 6.283); cx.fill();
    }
  }
  function loop(ts) { raf = requestAnimationFrame(loop); if (ts - last < 33) return; last = ts; draw(true); }
  function start() {
    root.classList.toggle("fx-off", !self.on);
    cancelAnimationFrame(raf); raf = 0;
    if (!self.on) { cx.clearRect(0, 0, W, H); return; }
    if (still) draw(false); else raf = requestAnimationFrame(loop);
  }
  function toggle() { self.on = !self.on; store.set("fx", self.on ? "1" : "0"); start(); }
  addEventListener("resize", resize);
  recolor(); resize(); start();
  return self;
})();
$("fxBtn").onclick = () => { fx.toggle(); paintTools(); };

// ----- Model nào vừa máy này (Chatbot) -----
// Model trả lời và model lập chỉ mục chạy CÙNG LÚC khi hỏi đáp nên VRAM phải chứa cả hai; model OCR chạy một mình
// (app gỡ các model khác khi OCR). Bộ nhớ ước lượng như phần Benchmark: file model +5% +0,3 GB, cộng bộ nhớ ngữ cảnh.
const SG_CHAT_CTX = 16384, SG_EMB_CTX = 4096, SG_OCR_CTX = 16384;
const vramGb = () => usableMb() / 1024;
const memGb = (m, ctx) => { if (!m || !m.size_bytes) return 0; const s = m.size_bytes / 2 ** 30; return s * 1.05 + 0.3 + s * 2.3 * ctx / 1048576; };
const fitLevel = need => { const v = vramGb(); return !v || !need ? "" : need <= v - 1.5 ? "ok" : need <= v - 0.3 ? "tight" : "no"; };
const byId = id => models.find(m => m.id === id);
// Model trả lời tốt hơn khi lớn hơn; bỏ model embedding / OCR. Model lập chỉ mục: ưu tiên loại đa ngôn ngữ (tiếng Việt).
const isChatCand = m => m.type !== "embeddings" && !/embed|ocr|chandra/i.test(m.id);
const embRank = m => /qwen3[-_]?embedding/i.test(m.id) ? 0 : /bge-m3|multilingual|\be5\b|e5-|gte-multi|jina-embeddings-v3|granite-embedding/i.test(m.id) ? 1
  : /nomic/i.test(m.id) ? 2 : 3;
function fitFor(kind, m) {
  if (!m) return "";
  if (kind === "chatOcr") return fitLevel(memGb(m, SG_OCR_CTX));
  // tính chung với model đang chọn ở ô kia; model kia tự nó đã không vừa thì chỉ chấm model này (khỏi báo sai "quá lớn")
  const partner = kind === "chatModel" ? memGb(byId($("chatEmbed").value), SG_EMB_CTX) : memGb(byId($("chatModel").value), SG_CHAT_CTX);
  const own = memGb(m, kind === "chatModel" ? SG_CHAT_CTX : SG_EMB_CTX);
  return fitLevel(own + (fitLevel(partner) === "no" ? 0 : partner));
}
const fitMark = f => f ? t({ok: "sgOk", tight: "sgTight", no: "sgNo"}[f]) : "";
function suggestion() {
  if (!vramGb() || !models.length) return null;
  const lvl = (c, e) => fitLevel(memGb(c, SG_CHAT_CTX) + memGb(e, SG_EMB_CTX));
  // Xếp model trả lời: model chữ trước model thị giác (-vl-, chuyên đọc ảnh), rồi theo số tham số đọc từ tên (27b, 120b, e4b…;
  // không theo dung lượng file vì bản nén Q8 nặng gấp đôi Q4 mà không thông minh hơn), rồi theo dung lượng.
  // Ollama báo sẵn số tham số (vd. "4.3B"); không có thì đọc từ tên (gemma3:4b, gpt-oss:20b, qwen3-vl:8b…)
  const params = m => { const p = /([\d.]+)\s*([BM])/i.exec(m.params || ""); if (p) return +p[1] / (/m/i.test(p[2]) ? 1000 : 1);
    const x = /(?:^|[-_/:])e?(\d+(?:\.\d+)?)b(?=$|[-_.:])/i.exec(m.id); return x ? +x[1] : (m.size_bytes || 0) / 0.6e9; };
  const vl = m => /[-_]vl(?:[-_:]|$)/i.test(m.id) ? 1 : 0;
  const chats = models.filter(isChatCand).sort((a, b) => vl(a) - vl(b) || params(b) - params(a) || (b.size_bytes || 0) - (a.size_bytes || 0));
  const embs = models.filter(m => m.type === "embeddings").sort((a, b) => embRank(a) - embRank(b) || (b.size_bytes || 0) - (a.size_bytes || 0));
  const bestWith = (e, ok) => chats.find(c => ok.includes(lvl(c, e)));
  let chat = null, emb = null;
  for (const ok of [["ok"], ["ok", "tight"]]) {
    // Model lập chỉ mục tốt quan trọng cho tiếng Việt: chọn loại tốt nhất mà vẫn còn chỗ cho model trả lời
    // ít nhất bằng nửa model trả lời lớn nhất có thể (nếu dùng model lập chỉ mục nhỏ nhất).
    const top = Math.max(0, ...(embs.length ? embs : [null]).map(e => { const c = bestWith(e, ok); return c ? params(c) : 0; }));
    for (const e of embs.length ? embs : [null]) {
      const c = bestWith(e, ok);
      if (c && params(c) >= top * 0.5) { chat = c; emb = e; break; }
    }
    if (chat) break;
  }
  const vis = models.filter(m => m.type === "vlm" && fitLevel(memGb(m, SG_OCR_CTX)) !== "no");
  // OCR: model chuyên OCR nếu có, rồi model thị giác KHÔNG có chế độ suy nghĩ (bản -instruct; bản thinking chỉ suy nghĩ,
  // không chép chữ) – Qwen-VL trước vì chép chữ tốt – rồi model thị giác bất kỳ.
  const nothink = m => !(m.capabilities || []).includes("thinking");
  const ocr = vis.find(m => /chandra|ocr/i.test(m.id)) || vis.find(m => nothink(m) && /qwen[\d.]*-?vl/i.test(m.id))
    || vis.find(nothink) || null;
  const tips = [];
  if (!chat) tips.push(t("sgNeedChat"));
  if (!emb || embRank(emb) > 1) tips.push(t("sgNeedEmb"));
  if (!ocr) tips.push(t("sgNeedOcr"));
  return {chat, emb, ocr, tips, vram: vramGb()};
}
function paintSugg() {
  const s = suggestion(), box = $("chatSugg");
  box.hidden = !s;
  if (!s) return;
  const same = (!s.chat || $("chatModel").value === s.chat.id) && (!s.emb || $("chatEmbed").value === s.emb.id) && (!s.ocr || $("chatOcr").value === s.ocr.id);
  const row = (label, m, kind) => `<div class="sgrow"><span>${t(label)}</span><b>${m ? esc(m.id.split("/").pop()) : "–"}</b>${m
    ? `<em>${gb(memGb(m, kind === "chatOcr" ? SG_OCR_CTX : kind === "chatEmbed" ? SG_EMB_CTX : SG_CHAT_CTX) * 1024)} GB</em>` : ""}</div>`;
  const reindex = s.emb && chatState && chatState.embed_model && chatState.embed_model !== s.emb.id;
  box.innerHTML = `<summary>${t("sgTitle", gb(s.vram * 1024))}</summary>
    ${row("sgChat", s.chat, "chatModel")}${row("sgEmb", s.emb, "chatEmbed")}${row("sgOcr", s.ocr, "chatOcr")}
    <div class="help">${t("sgNote")}</div>
    ${s.tips.map(x => `<div class="sgtip">💡 ${esc(x)}</div>`).join("")}
    ${same ? `<div class="sgsame">${t("sgSame")}</div>` : `<button id="sgApply" class="primary">${t("sgApply")}</button>`}
    ${!same && reindex ? `<div class="help">${t("sgReindex")}</div>` : ""}`;
  if (!box.dataset.init) { box.open = !same; box.dataset.init = "1"; }
}
$("chatSugg").addEventListener("click", e => {
  if (e.target.id !== "sgApply") return;
  const s = suggestion(); if (!s) return;
  for (const [id, m] of [["chatModel", s.chat], ["chatEmbed", s.emb], ["chatOcr", s.ocr]])
    if (m) { $(id).value = m.id; store.set(id, m.id); }
  fillChatModels(); paintDocs();
});

function fillChatModels() {
  const opt = (m, kind) => `<option value="${esc(m.id)}">${esc(m.id)}${m.quantization ? ` (${esc(m.quantization)})` : ""}${m.state === "loaded" ? t("loaded") : ""}${fitMark(fitFor(kind, m))}</option>`;
  const fill = (id, list, pick, html) => {
    const el = $(id); if (document.activeElement === el) return;
    const cur = el.value || store.get(id) || pick(list) || "";
    el.innerHTML = html || list.map(m => opt(m, id)).join("");
    if (list.some(m => m.id === cur)) el.value = cur;
  };
  // Model tên có "embed" (vd. Qwen3 VL Embedding bị LM Studio xếp là model thị giác) không dùng để trả lời được: đưa xuống cuối.
  const chatList = models.filter(m => m.type !== "embeddings").sort((a, b) => /embed/i.test(a.id) - /embed/i.test(b.id));
  fill("chatModel", chatList, l => (l.find(m => m.state === "loaded" && !/embed/i.test(m.id)) || l[0] || {}).id);
  // Ô embedding liệt kê mọi model: nhóm dùng được ngay, rồi các model khác (model tên có "embed" lên đầu).
  const emb = models.filter(m => m.type === "embeddings");
  const other = models.filter(m => m.type !== "embeddings").sort((a, b) => /embed/i.test(b.id) - /embed/i.test(a.id));
  const vis = models.filter(m => m.type === "vlm").sort((a, b) => /ocr/i.test(b.id) - /ocr/i.test(a.id));
  const ocrEl = $("chatOcr");
  if (document.activeElement !== ocrEl && models.length) {  // đợi có danh sách model rồi mới chọn mặc định
    const saved = store.get("chatOcr");
    const want = ocrEl.dataset.init ? ocrEl.value : (saved !== null ? saved
      : ((vis.find(m => /chandra|ocr/i.test(m.id)) || vis.find(m => !(m.capabilities || []).includes("thinking") && /qwen[\d.]*-?vl/i.test(m.id))
         || vis.find(m => !(m.capabilities || []).includes("thinking")) || {}).id || ""));
    ocrEl.innerHTML = `<option value="">${esc(t("ocrNone"))}</option>` + vis.map(m => opt(m, "chatOcr")).join("");
    ocrEl.value = vis.some(m => m.id === want) ? want : ""; ocrEl.dataset.init = "1";
  }
  fill("chatEmbed", [...emb, ...other],
       () => (chatState && chatState.embed_model) || (emb.find(m => /qwen3-embedding|bge-m3|e5/i.test(m.id)) || emb[0] || {}).id,
       (emb.length ? `<optgroup label="${esc(t("embedGroupOk"))}">${emb.map(m => opt(m, "chatEmbed")).join("")}</optgroup>` : "")
       + (other.length ? `<optgroup label="${esc(t("embedGroupOther"))}">${other.map(m => opt(m, "chatEmbed")).join("")}</optgroup>` : ""));

      return head + `<div class="vchunk${hits.has(c.i) ? " hit" : ""}${c.i === x.i ? " main" : ""}" id="vc${c.i}">${hits.has(c.i) ? markLines(c.text, citeText(m, hits.get(c.i))) : esc(c.text)}</div>`;
    }).join("");
    const el = $("vc" + x.i); if (el) el.scrollIntoView({block: "center"});
  } catch (e) { $("viewerBody").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
$("viewerClose").onclick = () => { $("viewer").hidden = true; };
$("viewer").onclick = e => { if (e.target === $("viewer")) $("viewer").hidden = true; };
$("viewerOpen").onclick = () => { if (!viewerSrc) return; if (viewerSrc.kind === "web") window.open(viewerSrc.url, "_blank", "noopener"); else openDoc(viewerSrc.doc); };
async function exportBlock(mi, bi) {
  const b = chatMsgs[mi] && chatMsgs[mi].blocks && chatMsgs[mi].blocks[bi];
  if (!b) return;
  try {
    const r = await fetch("/api/chat/excel", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(b)});
    if (!r.ok) throw new Error(tr((await r.json().catch(() => ({}))).detail || r.statusText));
    const a = document.createElement("a"), d = new Date(), z = v => String(v).padStart(2, "0");
    a.href = URL.createObjectURL(await r.blob());
    a.download = `${b.chart ? "bieu-do" : "bang"}-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.xlsx`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert(e.message); }
}
$("chatLog").onclick = e => {
  const c = e.target.closest(".cite, .srcrow"), b = e.target.closest(".blockbar button");
  if (b) exportBlock(+b.dataset.m, +b.dataset.b);
  else if (c) { const el = c.closest("[data-n]"); openSource(+el.dataset.m, +el.dataset.n); }
};
async function chatSend() {
  const text = $("chatInput").value.trim(), model = $("chatModel").value;
  if (!text || chatBusy || !model) return;
  const useDocs = $("chatDocs").checked, useWeb = $("chatWeb").checked;
  chatMsgs.push({role: "user", content: text});
  const bot = {role: "assistant", content: "", status: "", docs: useDocs, web: useWeb};
  const messages = chatMsgs.map(m => ({role: m.role, content: m.content}));
  chatMsgs.push(bot);
  $("chatInput").value = ""; chatBusy = true; paintChat();
  try {
    const r = await fetch("/api/chat/ask", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({model, messages, use_docs: useDocs, use_web: useWeb})});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "status") bot.status = ev.text;
        else if (ev.type === "route") bot.chat = ev.mode === "chat";
        else if (ev.type === "sources") { bot.sources = ev.sources; bot.ctx = ev.ctx; }
        else if (ev.type === "text") bot.content += ev.text;
        else if (ev.type === "done") bot.stats = ev;
        else if (ev.type === "error") bot.error = ev.text;
      }
      paintChat();
    }
  } catch (e) { bot.error = e.message; }
  if (!bot.content && !bot.error) bot.error = "Model trả lời rỗng";
  chatBusy = false; paintChat(); $("chatInput").focus();
  saveConv();
}
$("chatSend").onclick = chatSend;
$("chatInput").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } };

// ----- Lịch sử hội thoại: lưu trên máy chủ (SQLite), tự lưu sau mỗi câu trả lời -----
let convId = null, convTitle = "", convs = [], convTimer = null;
const newConvId = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
async function saveConv() {
  if (!chatMsgs.length) return;
  convId = convId || newConvId();
  try {
    const r = await api("/api/chat/conversations/" + convId, {method: "PUT", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({messages: chatMsgs})});
    convTitle = r.title; store.set("chatConv", convId);
  } catch (e) {}
  paintConvName(); loadConvs();
}
async function loadConvs() {
  try { convs = await api("/api/chat/conversations?q=" + encodeURIComponent($("convSearch").value.trim())); } catch (e) { convs = []; }
  paintConvs();
}
function paintConvName() { $("convName").textContent = convId ? convTitle : t("convNew"); }
function paintConvs() {
  const q = $("convSearch").value.trim();
  if (!convs.length) { $("convList").innerHTML = `<div class="convempty">${t(q ? "convNone" : "convEmpty")}</div>`; return; }
  // nhóm theo ngày: hôm nay / hôm qua / 7 ngày qua / cũ hơn
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const start = day.getTime() / 1000, grp = u => u >= start ? "convToday" : u >= start - 86400 ? "convYesterday" : u >= start - 7 * 86400 ? "convWeek" : "convOlder";
  const when = u => { const d = new Date(u * 1000), z = v => String(v).padStart(2, "0");
    return u >= start ? `${z(d.getHours())}:${z(d.getMinutes())}` : `${z(d.getDate())}/${z(d.getMonth() + 1)}/${d.getFullYear()}`; };
  let last = "", h = "";
  for (const c of convs) {
    const g = grp(c.updated);
    if (g !== last) { h += `<div class="convgrp">${t(g)}</div>`; last = g; }
    h += `<div class="conv${c.id === convId ? " on" : ""}" data-conv="${esc(c.id)}" title="${esc(c.title)}">
      <div class="ct">${esc(c.title)}</div><div class="cm">${when(c.updated)} · ${t("convMsgs", c.n)}</div>
      <div class="ca"><button data-act="rename" title="${t("convRename")}">✎</button><button class="del" data-act="delete" title="${t("convDelete")}">🗑</button></div></div>`;
  }
  $("convList").innerHTML = h;
}
async function openConv(id) {
  if (chatBusy) { alert(t("convBusy")); return; }
  try {
    const c = await api("/api/chat/conversations/" + encodeURIComponent(id));
    convId = c.id; convTitle = c.title; chatMsgs = c.messages; store.set("chatConv", convId);
  } catch (e) { alert(e.message); return; }
  $("viewer").hidden = true;
  paintChat(); paintConvName(); paintConvs();
  const log = $("chatLog"); log.scrollTop = log.scrollHeight;
}
function newConv() {
  if (chatBusy) return;
  convId = null; convTitle = ""; chatMsgs = []; store.set("chatConv", "");
  paintChat(); paintConvName(); paintConvs(); $("chatInput").focus();
}
$("chatNew").onclick = newConv;
$("convList").onclick = async e => {
  const item = e.target.closest("[data-conv]");
  if (!item) return;
  const id = item.dataset.conv, act = e.target.closest("[data-act]");
  const c = convs.find(x => x.id === id) || {title: ""};
  if (!act) { if (id !== convId) openConv(id); return; }
  if (act.dataset.act === "rename") {
    const name = prompt(t("convRenameAsk"), c.title);
    if (!name || !name.trim() || name.trim() === c.title) return;
    try {
      await api("/api/chat/conversations/" + encodeURIComponent(id), {method: "PATCH", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({title: name.trim()})});
      if (id === convId) { convTitle = name.trim(); paintConvName(); }
    } catch (err) { alert(err.message); }
  } else if (act.dataset.act === "delete") {
    if (!confirm(t("convDeleteAsk", c.title))) return;
    try { await api("/api/chat/conversations/" + encodeURIComponent(id), {method: "DELETE"}); } catch (err) { alert(err.message); return; }
    if (id === convId) newConv();
  }
  loadConvs();
};
$("convSearch").oninput = () => { clearTimeout(convTimer); convTimer = setTimeout(loadConvs, 250); };
$("convToggle").onclick = () => {
  const off = $("convPane").closest(".chatcard").classList.toggle("noconv");
  store.set("convPane", off ? "0" : "1");
};
if (store.get("convPane") === "0") document.querySelector(".chatcard").classList.add("noconv");
(async () => {  // mở lại cuộc trò chuyện đang dở lần trước
  await loadConvs();
  const last = store.get("chatConv");
  if (last && convs.some(c => c.id === last)) openConv(last); else paintConvName();
})();

applyLang();
if (store.get("view") === "chat") setView("chat"); else setView("bench");
(async () => {
  mods = await api("/api/modules");
  fillModules();
  renderForm();
  await refreshStatus();
  await loadHistory();
  loadDirs();
  setInterval(refreshStatus, 3000);  // chạy cả khi đang test để công suất GPU trên thanh đầu luôn cập nhật
})();
</script>
